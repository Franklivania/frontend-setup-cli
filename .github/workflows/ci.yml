name: CLI checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Commit package-lock.json and switch this to npm ci for reproducible CI.
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
