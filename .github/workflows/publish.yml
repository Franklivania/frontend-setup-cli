name: Publish CLI to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # The starter archive does not include package-lock.json. Run npm install locally,
      # commit the generated lockfile, then switch this step to `npm ci`.
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@latest

      - name: Check tag matches package version
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish with npm trusted publishing
        run: npm publish
